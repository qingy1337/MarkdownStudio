<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta http-equiv="content-language" content="en">
    <meta http-equiv="content-script-type" content="text/javascript">
    <meta http-equiv="content-style-type" content="text/css">
    <meta name="description" content="This is the online markdown editor with live preview.">

    <script>
      (function(){
        try {
          var BOOT_THEME_KEY = 'com.markdownlivepreview_theme';
          var raw = localStorage.getItem(BOOT_THEME_KEY);
          var useDark = raw === 'dark';
          document.documentElement.setAttribute('data-theme', useDark ? 'dark' : 'light');

          var PREVIEW_CSS_LIGHT = 'css/github-markdown-light.css?v=a1a198514565';
          var PREVIEW_CSS_DARK = 'css/github-markdown-dark_dimmed.css?v=5d3f5d9d207c';
          var href = useDark ? PREVIEW_CSS_DARK : PREVIEW_CSS_LIGHT;

          var link = document.createElement('link');
          link.id = 'gh-markdown-link';
          link.rel = 'stylesheet';
          link.type = 'text/css';
          link.href = href;
          document.head.appendChild(link);
        } catch (e) {
          // ignore — app will correct theme after load
        }
      })();
    </script>
    <link rel="stylesheet" type="text/css" href="css/style.css?v=b4472da6a0f4">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
    <link rel="icon" type="image/png" href="favicon.png">
    <script type="module" src="/src/main.js?v=1.14.0"></script>
    <title>Markdown Live Preview</title>
  </head>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-77C1GEG9C8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-77C1GEG9C8');
  </script>

  <body>

    <header>
        <div class="header-start">
            <button type="button" id="sidebar-toggle" class="icon-button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar (⌘/Ctrl+B)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.75A1.75 1.75 0 0 1 5.75 4h12.5A1.75 1.75 0 0 1 20 5.75v12.5A1.75 1.75 0 0 1 18.25 20H5.75A1.75 1.75 0 0 1 4 18.25V5.75Zm5.25-.25v13h9.5v-13h-9.5Zm-1.5 0h-2.5v13h2.5v-13Z"/></svg>
            </button>
            <a class="brand" href="/">Markdown <b>Studio</b></a>
        </div>
        <div id="menu-items">
            <button type="button" id="open-button" class="toolbar-button">Open</button>
            <input type="file" id="open-file-input" accept=".md,.markdown,text/markdown" hidden>
            <button type="button" id="copy-button" class="toolbar-button">Copy</button>
            <button type="button" id="export-button" class="toolbar-button">Export PDF</button>
            <button type="button" id="reset-button" class="toolbar-button danger">Reset</button>
            <div class="header-controls">
              <label class="toggle-control" for="sync-scroll-checkbox">
                <input type="checkbox" id="sync-scroll-checkbox"><span class="toggle-track" aria-hidden="true"></span><span>Sync scroll</span>
              </label>
              <label class="toggle-control" for="theme-checkbox">
                <input type="checkbox" id="theme-checkbox"><span class="toggle-track" aria-hidden="true"></span><span>Dark mode</span>
              </label>
            </div>
        </div>
    </header>

    <div id="workspace">
      <aside id="tab-sidebar" aria-label="Documents">
        <div class="sidebar-topline">
          <div class="sidebar-heading"><span class="sidebar-eyebrow">Workspace</span><span class="sidebar-title">Documents</span></div>
          <button type="button" id="new-tab-button" class="icon-button add-document" aria-label="New document" title="New document (⌘/Ctrl+Shift+N)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div id="tab-list" role="tablist" aria-label="Open documents"></div>
        <div class="sidebar-footer"><span class="sidebar-shortcut">⌘⇧N</span><span class="sidebar-footer-label">New document</span></div>
      </aside>

      <div id="container" class="split-container">
        <div id="document-bar" aria-live="polite">
          <span class="document-bar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.75 3.75h7.1l4.4 4.4v12.1H6.75a1 1 0 0 1-1-1v-14.5a1 1 0 0 1 1-1Zm6.5 1.8v3.3h3.3"/></svg></span>
          <span id="current-document-name">Untitled document</span>
          <span id="document-updated">Last updated: just now</span>
        </div>
        <div id="document-split" class="split-container">

        <div id="edit" class="column editor-pane">
            <div id="editor-wrapper">
                <div id="editor"></div>
            </div>
        </div>

        <div id="split-divider" class="split-divider"></div>

        <div id="preview" class="column preview-pane">
            <div id="preview-wrapper">
                <div id="output" class="content markdown-body"></div>
            </div>
        </div>
        </div>
      </div>
    </div>

    <footer></footer>
  </body>
</html>
